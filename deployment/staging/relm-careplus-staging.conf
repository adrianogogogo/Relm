# Nginx Configuration - Relm Care+ STAGING
# File: /etc/nginx/sites-available/relm-careplus-staging.conf

# ============================================
# FRONTEND (Flutter Web)
# ============================================
server {
    listen 80;
    listen [::]:80;
    server_name staging-careplus.relmbikes.com.br;

    root /var/www/relm-careplus-staging-web;
    index index.html;

    # Logs
    access_log /var/log/nginx/relm-careplus-staging-front-access.log;
    error_log /var/log/nginx/relm-careplus-staging-front-error.log;

    # Flutter Web SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SSL will be added by certbot
}

# ============================================
# API (NestJS Backend)
# ============================================
server {
    listen 80;
    listen [::]:80;
    server_name staging-api-careplus.relmbikes.com.br;

    # Logs
    access_log /var/log/nginx/relm-careplus-staging-api-access.log;
    error_log /var/log/nginx/relm-careplus-staging-api-error.log;

    # Reverse proxy to Node.js backend
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Cache
        proxy_cache_bypass $http_upgrade;
    }

    # SSL will be added by certbot
}
