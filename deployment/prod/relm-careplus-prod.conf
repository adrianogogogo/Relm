# Nginx Configuration - Relm Care+ PRODUCTION
# Servidor: 177.153.62.248
# Instalação: /etc/nginx/sites-available/relm-careplus-prod.conf
#
# Fase 1 (sem DNS): frontend acessível via http://177.153.62.248
#                   API acessível via http://177.153.62.248:3005
# Fase 2 (com DNS): adicionar certbot para SSL e atualizar server_name

# ============================================
# FRONTEND (React/Vite — SPA)
# ============================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Fase 1: acesso por IP direto
    # Fase 2: adicionar domínio aqui e rodar certbot
    server_name 177.153.62.248 careplus.relmbikes.com.br;

    root /var/www/relm-careplus-prod-web;
    index index.html;

    # Logs
    access_log /var/log/nginx/relm-careplus-front-access.log;
    error_log  /var/log/nginx/relm-careplus-front-error.log;

    # React SPA — todas as rotas entregam index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets estáticos (JS, CSS, imagens)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Segurança básica
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # SSL será adicionado pelo certbot quando o DNS estiver configurado:
    # sudo certbot --nginx -d careplus.relmbikes.com.br
}

