name: relm_careplus_web
description: Relm Care+ - Centro de Serviços ao Cliente Flutter Web

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

  # State Management
  provider: ^6.1.1

  # HTTP
  dio: ^5.4.0
  http: ^1.1.2

  # Routing
  go_router: ^13.0.0

  # Storage
  shared_preferences: ^2.2.2

  # Utils
  intl: ^0.18.1
  flutter_svg: ^2.0.9

  # Forms
  mask_text_input_formatter: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

